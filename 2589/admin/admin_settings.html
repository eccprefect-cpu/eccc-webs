<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access Manager - ECCPMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        html,
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDFCF9;
            overflow-x: hidden;
            max-width: 100%;
        }

        .text-primary {
            color: #800000;
        }

        .bg-primary {
            background-color: #800000;
        }
    </style>
</head>

<body class="p-4 md:p-10 min-h-screen flex flex-col">

    <div class="max-w-6xl mx-auto w-full">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 md:mb-10 gap-4">
            <h1 class="text-2xl md:text-3xl font-black text-gray-800 text-center md:text-left">Admin Access Requests
            </h1>
            <a href="dashboard.html" class="text-primary font-bold hover:underline text-sm md:text-base">Back to
                Dashboard</a>
        </div>

        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200 w-full">
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6">Name</th>
                            <th class="py-3 px-6">Role</th>
                            <th class="py-3 px-6">Admission No</th>
                            <th class="py-3 px-6">Status</th>
                            <th class="py-3 px-6">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="text-gray-700 text-sm font-light">
                        <!-- Rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto w-full mt-12 mb-20">
        <h2 class="text-2xl md:text-3xl font-black text-gray-800 text-center md:text-left mb-6">Contact Messages</h2>

        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200 w-full">
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6">Sender Checks</th>
                            <th class="py-3 px-6">Message Data</th>
                            <th class="py-3 px-6 w-32">Timestamp</th>
                            <th class="py-3 px-6 w-24">Status</th>
                        </tr>
                    </thead>
                    <tbody id="messagesTableBody" class="text-gray-700 text-sm font-light">
                        <!-- Messages will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config (Using same as other files)
        const firebaseConfig = {
            apiKey: "AIzaSyCqO--dglz2f7xH6stf_yqzjhpJtivjYh8",
            authDomain: "pms-registration-38fd9.firebaseapp.com",
            projectId: "pms-registration-38fd9",
            storageBucket: "pms-registration-38fd9.firebasestorage.app",
            messagingSenderId: "751314316733",
            appId: "1:751314316733:web:beb5b0377934e2339df6d4",
            measurementId: "G-DBRLXJ0Y14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tableBody = document.getElementById('adminTableBody');

        // Real-time listener
        onSnapshot(collection(db, "app_admins"), (snapshot) => {
            tableBody.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const admin = docSnap.data();
                const id = docSnap.id;

                let statusColor = 'bg-yellow-100 text-yellow-700';
                if (admin.status === 'approved') statusColor = 'bg-green-100 text-green-700';
                if (admin.status === 'rejected') statusColor = 'bg-red-100 text-red-700';

                const row = `
                    <tr class="border-b border-gray-200 hover:bg-gray-50">
                        <td class="py-3 px-6 font-medium">${admin.fullName} <br> <span class="text-gray-400 text-xs">${admin.email}</span></td>
                        <td class="py-3 px-6">${admin.role}</td>
                        <td class="py-3 px-6">${admin.admissionNo}</td>
                        <td class="py-3 px-6"><span class="${statusColor} py-1 px-3 rounded-full text-xs font-bold uppercase">${admin.status}</span></td>
                        <td class="py-3 px-6 flex space-x-2">
                            ${admin.status !== 'approved' ? `<button onclick="updateStatus('${id}', 'approved')" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 text-xs">Approve</button>` : ''}
                            ${admin.status !== 'rejected' ? `<button onclick="updateStatus('${id}', 'rejected')" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-xs">Reject</button>` : ''}
                        </td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        });

        // Real-time listener for CONTACT MESSAGES
        const msgTableBody = document.getElementById('messagesTableBody');
        onSnapshot(collection(db, "contact_messages"), (snapshot) => {
            msgTableBody.innerHTML = '';
            if (snapshot.empty) {
                msgTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-gray-400 italic">No messages received yet.</td></tr>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const id = docSnap.id;
                const time = msg.timestamp ? new Date(msg.timestamp).toLocaleDateString() + ' ' + new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'N/A';

                const row = `
                     <tr class="border-b border-gray-200 hover:bg-gray-50 align-top">
                         <td class="py-4 px-6">
                             <span class="font-bold text-gray-800 block">${msg.name}</span>
                             <span class="text-xs text-gray-500">${msg.email}</span>
                         </td>
                         <td class="py-4 px-6">
                             <p class="text-sm text-gray-600 line-clamp-3 hover:line-clamp-none transition-all duration-300 w-full max-w-lg bg-gray-50 p-2 rounded">
                                 ${msg.message}
                             </p>
                         </td>
                         <td class="py-4 px-6 text-xs font-mono text-gray-500 whitespace-nowrap">${time}</td>
                         <td class="py-4 px-6">
                             <span class="bg-blue-100 text-blue-700 py-1 px-3 rounded-full text-[10px] font-bold uppercase tracking-wider">${msg.status || 'unread'}</span>
                         </td>
                     </tr>
                 `;
                msgTableBody.insertAdjacentHTML('beforeend', row);
            });
        });

        window.updateStatus = async (uid, newStatus) => {
            try {
                const adminRef = doc(db, "app_admins", uid);
                await updateDoc(adminRef, { status: newStatus });
                // Alert removed for smoother UX, table updates automatically
            } catch (error) {
                console.error("Error updating status:", error);
                alert("Error updating status: " + error.message);
            }
        };
    </script>
</body>

</html>
